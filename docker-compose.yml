version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecoquest-db
    restart: always
    environment:
      MYSQL_DATABASE: Ecoquest2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoquest-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_URL=jdbc:mysql://db:3306/Ecoquest2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USER=root
      - DB_PASSWORD=root
      - PORT=5000
      - FRONTEND_URL=http://localhost
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoquest-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
