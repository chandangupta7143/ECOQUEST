# ─────────────────────────────────────────────────────────────────────────────
# EcoQuest Spring Boot Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Disable Spring Boot's auto mail configuration (configured in MailConfig)
# and UserDetailsServiceAutoConfiguration to prevent generated password warning and startup overhead
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Server
server.port=${PORT:5000}
server.servlet.context-path=/

# ── MySQL Database ─────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Ecoquest2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Security ────────────────────────────────────────────────────────────────
app.security.bcrypt-strength=${BCRYPT_STRENGTH:10}

# ── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:EcoQuestSuperSecretKey2024ChangeThisInProductionToAtLeast32Chars!}
app.jwt.expiration-ms=604800000

# ── File Uploads ────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ── Email (optional — leave blank to auto-verify in dev mode) ────────────
app.email.user=${EMAIL_USER:}
app.email.pass=${EMAIL_PASS:}
app.email.from=EcoQuest <noreply@ecoquest.app>

# ── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:https://ecoquest-jy5g.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.ecoquest=INFO
logging.level.org.springframework.security=WARN