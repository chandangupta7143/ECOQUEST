# Test Configuration with In-Memory H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=TestSecretKeyThatIsAtLeast32CharactersLongForJWTValidation!
app.jwt.expiration-ms=3600000

app.email.user=
app.email.pass=
app.email.from=EcoQuest <noreply@ecoquest.app>
app.cors.allowed-origins=http://localhost:5173

server.port=0
logging.level.com.ecoquest=INFO
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
